name: Train model

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 2"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.train_model
      - name: Save model to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f models/model.joblib models/meta.json
          git diff --staged --quiet || git commit -m "Retrain model"
          git push
